global:
  output_dir: comparison_bench/outputs_comparison/real_ir_success_first/scalability_synth
  max_workers: 4

datasets:
  - dataset_id: synthetic_long_d16_ser003
    path: comparison_bench/outputs_comparison/real_ir_success_first/synthetic_long.csv
    dimension: 16
    frame_len_symbols: 2048

methods:
  - method: cascade_lite
    method_variant: gray_opt
    mapping: gray
    backend: internal_cascade_lite
    cascade_passes: 3
    cascade_seed: 0
    block_size_schedule: [16, 32, 64, 128]
  - method: layered_ldpc_lite
    method_variant: gray_opt
    mapping: gray
    backend: ldpc_bposd
    parity_check_source: deterministic_sparse
    parity_fraction: 0.8
    column_weight: 3
    ldpc_seed: 20260414
    osd_order: 0
    unverified_policy: revert_to_bob_decode_failed
    max_iter: 50
    llr_mode: bsc_estimated
    bitplane_rate_mode: uniform
